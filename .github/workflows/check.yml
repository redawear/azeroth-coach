name: Check
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.16.0, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
  installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Test the QuestieDB release download
        run: node scripts/test-questiedb.js
      - name: Test the silent installer
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AzerothCoach-Setup
          path: dist/AzerothCoach-Setup.exe
          if-no-files-found: error
      - name: Save Windows test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Windows-installer-logs
          path: |
            ${{ runner.temp }}/azeroth-installer-test/**/*.log
            ${{ runner.temp }}/azeroth-installer-test/**/gui-mcp.json
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Attach the installer to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_RUN: ${{ github.run_id }}
        run: |
          gh run download "$BUILD_RUN" --repo redawear/azeroth-coach --name AzerothCoach-Setup --dir dist
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("release.json")).isDraft) process.exit(1)'
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --notes 'Download AzerothCoach-Setup.exe, then run it on Windows.'
          fi
          gh release upload "$RELEASE_TAG" dist/AzerothCoach-Setup.exe --clobber
